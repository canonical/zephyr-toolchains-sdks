name: zephyr-sdk-ng
version: "0.16.9"
build-base: ubuntu@26.04
summary: Zephyr SDK NG
description: |
  This SDK provides the Zephyr RTOS source tree and build tools (west, cmake,
  ninja, QEMU) for embedded firmware development. A companion toolchain SDK is
  required to target a specific architecture. The Zephyr build cache and Python
  virtual environment are persisted on the host across workshop updates.
license: Apache-2.0
website: https://github.com/canonical/zephyr-sdk-ng
platforms:
  amd64:

plugs:
  amd64:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/x86_64-zephyr-elf
  arm64:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/aarch64-zephyr-elf
  arm:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/arm-zephyr-eabi
  riscv64:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/riscv64-zephyr-elf
  xtensa-espressif-esp32s3:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-espressif_esp32s3_zephyr-elf
  xtensa-espressif-esp32:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-espressif_esp32_zephyr-elf
  arc:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/arc-zephyr-elf
  arc64:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/arc64-zephyr-elf
  microblazeel:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/microblazeel-zephyr-elf
  mips:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/mips-zephyr-elf
  nios2:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/nios2-zephyr-elf
  sparc:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/sparc-zephyr-elf
  xtensa-amd-acp-6-0-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-amd_acp_6_0_adsp_zephyr-elf
  xtensa-dc233c:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-dc233c_zephyr-elf
  xtensa-espressif-esp32s2:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-espressif_esp32s2_zephyr-elf
  xtensa-intel-ace15-mtpm:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-intel_ace15_mtpm_zephyr-elf
  xtensa-intel-ace30-ptl:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-intel_ace30_ptl_zephyr-elf
  xtensa-intel-tgl-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-intel_tgl_adsp_zephyr-elf
  xtensa-mtk-mt8195-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-mtk_mt8195_adsp_zephyr-elf
  xtensa-nxp-imx-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_imx_adsp_zephyr-elf
  xtensa-nxp-imx8m-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_imx8m_adsp_zephyr-elf
  xtensa-nxp-imx8ulp-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_imx8ulp_adsp_zephyr-elf
  xtensa-nxp-rt500-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_rt500_adsp_zephyr-elf
  xtensa-nxp-rt600-adsp:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_rt600_adsp_zephyr-elf
  xtensa-nxp-rt700-hifi1:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_rt700_hifi1_zephyr-elf
  xtensa-nxp-rt700-hifi4:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-nxp_rt700_hifi4_zephyr-elf
  xtensa-sample-controller:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-sample_controller_zephyr-elf
  xtensa-sample-controller32:
    interface: mount
    workshop-target: $SDK/zephyr-sdk/xtensa-sample_controller32_zephyr-elf

slots:
  sdk-ng:
    interface: mount
    workshop-source: $SDK

parts:
  zephyr-sdk-ng:
    plugin: nil
    build-packages:
      - curl
      - jq
    override-build: |
      set -eu

      # Fetch the Zephyr SDK NG base (rtos-zephyr-sdk-ng-common) from the
      # arctic-tern zephyr-toolchain-24.04 PPA instead of the upstream minimal tarball,
      # for full control over the SDK contents.
      PKG="rtos-zephyr-sdk-ng-common"
      ARCHIVE="https://api.launchpad.net/devel/~arctic-tern/+archive/ubuntu/zephyr-toolchain-24.04"

      # Resolve the published .deb URL for this project version.
      SELF="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${ARCHIVE}?ws.op=getPublishedBinaries&binary_name=${PKG}&exact_match=true&status=Published" \
        | jq -r --arg v "$CRAFT_PROJECT_VERSION" \
            '[.entries[] | select(.binary_package_version | startswith($v + "-"))] | sort_by(.binary_package_version) | .[0].self_link' \
        | head -n1)"
      [ -n "$SELF" ]
      DEB_URL="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${SELF}?ws.op=binaryFileUrls" | jq -r '.[0]')"

      # Download and extract the .deb without dependency resolution.
      curl -fSL --retry 5 --retry-delay 3 --retry-all-errors --no-progress-meter -o "${CRAFT_PART_BUILD}/ng-common.deb" "$DEB_URL"
      dpkg-deb -x "${CRAFT_PART_BUILD}/ng-common.deb" "${CRAFT_PART_BUILD}/extract"

      # The base SDK lives under usr/lib/zephyr-sdk-<version>/; expose its
      # contents at $SDK/zephyr-sdk/.
      mkdir -p "${CRAFT_PART_INSTALL}/zephyr-sdk"
      cp -a "${CRAFT_PART_BUILD}"/extract/usr/lib/zephyr-sdk-*/. "${CRAFT_PART_INSTALL}/zephyr-sdk/"

      # Pre-create the toolchain mount points. At runtime, when a toolchain plug
      # (from a separate toolchain SDK) is connected to the toolchain slot, it is
      # mounted at $SDK/zephyr-sdk/<triple>. These empty directories must exist
      # ahead of time because the SDK is a read-only volume and workshop cannot
      # create them at launch or refresh.
      for target in \
        aarch64-zephyr-elf \
        arc-zephyr-elf \
        arc64-zephyr-elf \
        arm-zephyr-eabi \
        microblazeel-zephyr-elf \
        mips-zephyr-elf \
        nios2-zephyr-elf \
        riscv64-zephyr-elf \
        sparc-zephyr-elf \
        x86_64-zephyr-elf \
        xtensa-amd_acp_6_0_adsp_zephyr-elf \
        xtensa-dc233c_zephyr-elf \
        xtensa-espressif_esp32_zephyr-elf \
        xtensa-espressif_esp32s2_zephyr-elf \
        xtensa-espressif_esp32s3_zephyr-elf \
        xtensa-intel_ace15_mtpm_zephyr-elf \
        xtensa-intel_ace30_ptl_zephyr-elf \
        xtensa-intel_tgl_adsp_zephyr-elf \
        xtensa-mtk_mt8195_adsp_zephyr-elf \
        xtensa-nxp_imx8m_adsp_zephyr-elf \
        xtensa-nxp_imx8ulp_adsp_zephyr-elf \
        xtensa-nxp_imx_adsp_zephyr-elf \
        xtensa-nxp_rt500_adsp_zephyr-elf \
        xtensa-nxp_rt600_adsp_zephyr-elf \
        xtensa-nxp_rt700_hifi1_zephyr-elf \
        xtensa-nxp_rt700_hifi4_zephyr-elf \
        xtensa-sample_controller32_zephyr-elf \
        xtensa-sample_controller_zephyr-elf; do
        mkdir -p "${CRAFT_PART_INSTALL}/zephyr-sdk/${target}"
      done
