name: zephyr-xtensa-espressif-esp32s3
version: "0.16.9"
build-base: ubuntu@26.04
summary: Zephyr Toolchain
description: |
  This SDK provides the Xtensa cross-compiler toolchain for building Zephyr
  firmware targeting the xtensa-espressif_esp32s3_zephyr-elf target triple. It
  also bundles the ESP32 HAL module (hal_espressif) and binary blobs required to
  build ESP32-S3 firmware. The ESP32 build tools (esptool) and Python
  dependencies are installed at launch from the Ubuntu archive and the
  arctic-tern/zephyr-toolchain-24.04 PPA. Use this SDK alongside the zephyr base
  SDK.
license: Apache-2.0
website: https://github.com/canonical/zephyr-xtensa-espressif-esp32s3-sdk
platforms:
  amd64:

slots:
  toolchain:
    interface: mount
    workshop-source: $SDK
  modules:
    interface: mount
    workshop-source: $SDK/modules
parts:
  toolchain:
    plugin: nil
    build-packages:
      - curl
      - jq
    override-build: |
      set -eu

      # Fetch the toolchain from the arctic-tern zephyr-toolchain-24.04 PPA instead of
      # the upstream release tarball, for full control over the SDK contents.
      PKG="rtos-zephyr-sdk-xtensa-espressif-esp32s3-zephyr-elf"
      TRIPLE="xtensa-espressif_esp32s3_zephyr-elf"
      ARCHIVE="https://api.launchpad.net/devel/~arctic-tern/+archive/ubuntu/zephyr-toolchain-24.04"

      # Resolve the published .deb URL for this project version.
      SELF="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${ARCHIVE}?ws.op=getPublishedBinaries&binary_name=${PKG}&exact_match=true&status=Published" \
        | jq -r --arg v "$CRAFT_PROJECT_VERSION" \
            '[.entries[] | select(.binary_package_version | startswith($v + "-"))] | sort_by(.binary_package_version) | .[0].self_link' \
        | head -n1)"
      [ -n "$SELF" ]
      DEB_URL="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${SELF}?ws.op=binaryFileUrls" | jq -r '.[0]')"

      # Download and extract the .deb without dependency resolution.
      curl -fSL --retry 5 --retry-delay 3 --retry-all-errors --no-progress-meter -o "${CRAFT_PART_BUILD}/toolchain.deb" "$DEB_URL"
      dpkg-deb -x "${CRAFT_PART_BUILD}/toolchain.deb" "${CRAFT_PART_BUILD}/extract"

      # The toolchain lives under usr/lib/zephyr-sdk-<version>/<triple>/; make
      # its contents the root of the SDK (matches the upstream tarball layout).
      cp -a "${CRAFT_PART_BUILD}"/extract/usr/lib/zephyr-sdk-*/"${TRIPLE}"/. "${CRAFT_PART_INSTALL}/"

  # ESP32 HAL module (hal_espressif) required to build ESP32-S3 firmware. The
  # module tree is fetched from the arctic-tern zephyr-toolchain-24.04 PPA (the
  # hal-espressif deb) instead of upstream GitHub, matching how the toolchain
  # itself is sourced. The ESP32 binary blobs (radio/PHY libraries) referenced
  # by the module's own zephyr/module.yml are downloaded and checksum-verified
  # at build time (the deb ships the module metadata but not the blobs).
  hal_espressif:
    plugin: nil
    source: .
    build-packages:
      - curl
      - jq
      - wget
    build-snaps:
      - yq
    override-build: |
      set -eu

      PKG="hal-espressif"
      ARCHIVE="https://api.launchpad.net/devel/~arctic-tern/+archive/ubuntu/zephyr-toolchain-24.04"

      # Resolve the published .deb URL for the latest hal-espressif version.
      SELF="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${ARCHIVE}?ws.op=getPublishedBinaries&binary_name=${PKG}&exact_match=true&status=Published" \
        | jq -r '[.entries[]] | sort_by(.binary_package_version) | .[-1].self_link')"
      [ -n "$SELF" ]
      DEB_URL="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${SELF}?ws.op=binaryFileUrls" | jq -r '.[0]')"

      # Download and extract the .deb without dependency resolution.
      curl -fSL --retry 5 --retry-delay 3 --retry-all-errors --no-progress-meter -o "${CRAFT_PART_BUILD}/hal-espressif.deb" "$DEB_URL"
      dpkg-deb -x "${CRAFT_PART_BUILD}/hal-espressif.deb" "${CRAFT_PART_BUILD}/hal-extract"

      MODULE_SRC="${CRAFT_PART_BUILD}/hal-extract/usr/share/zephyr-sdk/modules/hal-espressif"
      MODULE_DEST="${CRAFT_PART_INSTALL}/modules/hal/espressif"
      mkdir -p "$MODULE_DEST"
      cp -a "${MODULE_SRC}/." "${MODULE_DEST}/"

      # Download + checksum-verify the binary blobs listed in the module's own
      # module.yml.
      export PREFIX="${MODULE_DEST}/zephyr/blobs"
      export MODULE_YML="${MODULE_SRC}/zephyr/module.yml"
      "$CRAFT_PART_SRC/fetch-binary-blobs.sh"

      craftctl default
